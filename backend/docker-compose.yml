services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kram-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: kram_team
      DB_USERNAME: kram
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    command: php artisan serve --host=0.0.0.0 --port=8000

  postgres:
    image: postgres:16-alpine
    container_name: kram-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kram_team
      POSTGRES_USER: kram
      POSTGRES_PASSWORD: secret
    volumes:
      - kram_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kram-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kram_redis:/data

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kram-queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - postgres
      - redis
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: kram_team
      DB_USERNAME: kram
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    command: php artisan queue:work --tries=3 --timeout=90

volumes:
  kram_postgres:
  kram_redis:
