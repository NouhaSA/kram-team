services:
  postgres:
    image: postgres:16-alpine
    container_name: kram-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: kram_team
      POSTGRES_USER: kram
      POSTGRES_PASSWORD: secret
    volumes:
      - kram_postgres_prod:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: kram-redis-prod
    restart: unless-stopped
    volumes:
      - kram_redis_prod:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kram-backend-prod
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      APP_NAME: "Kram Team"
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: kram_team
      DB_USERNAME: kram
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    expose:
      - "9000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kram-frontend-prod
    restart: unless-stopped
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kram-queue-prod
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      APP_NAME: "Kram Team"
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: kram_team
      DB_USERNAME: kram
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    command: php artisan queue:work --tries=3 --timeout=90
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kram-scheduler-prod
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      APP_NAME: "Kram Team"
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: kram_team
      DB_USERNAME: kram
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    command: php artisan schedule:work
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: kram-nginx-prod
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kram_postgres_prod:
  kram_redis_prod:
