---
- name: Provisionner le serveur Kram Team
  hosts: kram_server
  become: true

  vars:
    deploy_user: deploy

  tasks:
    - name: Mettre a jour le cache apt
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Mettre a jour les paquets systeme
      apt:
        upgrade: dist

    - name: Creer l'utilisateur de deploiement
      user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true

    - name: Autoriser sudo sans mot de passe pour deploy
      copy:
        dest: "/etc/sudoers.d/{{ deploy_user }}"
        content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Copier la cle SSH publique de l'utilisateur deploy
      authorized_key:
        user: "{{ deploy_user }}"
        state: present
        key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_ed25519.pub') }}"

    - name: Desactiver la connexion SSH par mot de passe
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
      notify: Redemarrer ssh

    - name: Desactiver la connexion SSH root
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin no"
      notify: Redemarrer ssh

    - name: Installer les paquets requis pour Docker
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Ajouter la cle GPG officielle de Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Ajouter le depot Docker
      apt_repository:
        repo: "deb [arch={{ ansible_architecture }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Installer Docker Engine et le plugin Compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ajouter deploy au groupe docker
      user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true

    - name: Installer UFW
      apt:
        name: ufw
        state: present

    - name: Autoriser SSH dans UFW
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Autoriser HTTP dans UFW
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Autoriser HTTPS dans UFW
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Activer UFW
      community.general.ufw:
        state: enabled
        policy: deny

  handlers:
    - name: Redemarrer ssh
      service:
        name: ssh
        state: restarted